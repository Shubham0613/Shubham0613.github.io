<script>
/* ---------- Background Music: Two-Track Playlist ---------- */
(() => {
  const btn = document.getElementById("ambient-audio-toggle");
  const label = document.getElementById("ambient-audio-label");

  if (!btn || !label) return;

  const tracks = [
    {
      src: "./The_Slow_Breath.mp3",
      name: "The Slow Breath"
    },
    {
      src: "./Temple_of_the_Sacred_Breath.mp3",
      name: "Temple of the Sacred Breath"
    }
  ];

  const audio = new Audio();
  audio.preload = "auto";
  audio.loop = false;
  audio.volume = 0.35;

  let currentTrack = 0;
  let isPlaying = false;
  let userStopped = false;
  let retryListenersAdded = false;

  function updateUI(message) {
    btn.setAttribute("aria-pressed", String(isPlaying));
    btn.setAttribute(
      "aria-label",
      isPlaying ? "Turn off background music" : "Turn on background music"
    );

    label.textContent =
      message ||
      (isPlaying
        ? "Playing · " + tracks[currentTrack].name
        : "Enable background music");
  }

  async function playTrack(index) {
    currentTrack = index;
    audio.src = tracks[currentTrack].src;
    audio.load();

    try {
      await audio.play();
      isPlaying = true;
      userStopped = false;
      updateUI("Playing · " + tracks[currentTrack].name);
      removeRetryListeners();
    } catch (error) {
      isPlaying = false;
      updateUI("Click to start background music");
      addRetryListeners();
    }
  }

  function playNextTrack() {
    if (!isPlaying || userStopped) return;

    const next = (currentTrack + 1) % tracks.length;
    playTrack(next);
  }

  function addRetryListeners() {
    if (retryListenersAdded) return;

    retryListenersAdded = true;
    document.addEventListener("pointerdown", retryPlayback);
    document.addEventListener("keydown", retryPlayback);
    document.addEventListener("touchstart", retryPlayback, {
      passive: true
    });
  }

  function removeRetryListeners() {
    retryListenersAdded = false;
    document.removeEventListener("pointerdown", retryPlayback);
    document.removeEventListener("keydown", retryPlayback);
    document.removeEventListener("touchstart", retryPlayback);
  }

  function retryPlayback() {
    if (userStopped || isPlaying) {
      removeRetryListeners();
      return;
    }

    playTrack(currentTrack);
  }

  function stopMusic() {
    userStopped = true;
    isPlaying = false;

    audio.pause();
    audio.currentTime = 0;

    updateUI("Background music off");
    removeRetryListeners();
  }

  btn.addEventListener("click", () => {
    if (isPlaying) {
      stopMusic();
    } else {
      userStopped = false;
      playTrack(currentTrack);
    }
  });

  audio.addEventListener("ended", playNextTrack);

  audio.addEventListener("error", () => {
    if (!isPlaying || userStopped) return;

    // Try the other track if a file cannot be loaded.
    const failedTrack = currentTrack;
    const nextTrackIndex = (failedTrack + 1)
